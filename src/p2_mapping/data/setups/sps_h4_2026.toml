# SPS H4 beam test, July-August 2026: three P2 basket stations on the VMM DAQ.
#
# Cabling entries apply from `valid_from` (local time, Europe/Zurich) until the
# next entry. Each row is one hybrid: the detector connector it reads, its two
# VMMs, the cable, and the within-half channel order of each VMM.
#
# Sources: DAQ_Control_VMM_Beam run_config_beam.py (P2_VMM_CABLING,
# P2_VMM_CABLES, TRIGGER_VMM) and vmm_qa/vmm_stations.py (STATIONS,
# STRATEGY_OVERRIDES); SPS logbook "P2_EIC Beam Test July 2026 Log Book.md".

name = "sps_h4_2026"
site = "sps"
description = "SPS H4 beam test, Jul-Aug 2026: P2_IN / P2_MID / P2_OUT on the VMM DAQ"
design = "p2_basket"

[[detector]]
name = "P2_IN"
z_mm = 320.0

[[detector]]
name = "P2_MID"
z_mm = 630.0

[[detector]]
name = "P2_OUT"
z_mm = 940.0

# External trigger digitised on hybrid 0, not on any P2 station.
# MEASURED 2026-07-30 on run_24/nominal_05: VMM 0 ch 44 holds 100 % of that
# VMM's hits and VMM 1 never appears. The July notes said VMM 1 ch 60; that
# predates the 2026-07-29 recabling. Re-check after any hybrid-0 change.
[trigger]
hybrid = 0
vmm = 0
ch = 44

# The three stations were recabled onto the VMM DAQ on 2026-07-29 (logbook,
# "CONFIG CHANGE"). VMM data before that date has no cabling entry here.
#
# Two P2_IN top halves are read 'linear', the rest 'reverse'. Found on the
# beam data (run_24/nominal_05) by beam-spot compactness and map speckle
# (vmm_map_scan.py / vmm_map_rough.py); c5 top was also found independently by
# the DREAM readout (commit 659dfbb, "flipped c_5_top ribbon"). The lab cosmic
# study (obs 63) does not favour these overrides with Samtec cables, so they
# are recorded per cabling entry, not as a property of the detector.
[[cabling]]
valid_from = 2026-07-29T00:00:00
note = "all HITACHI 2m; HITACHI reference dataset = runs 38-48"
hybrids = [
  { detector = "P2_IN",  connector = 4, hybrid = 1, bottom_vmm = 2,  top_vmm = 3,  cable = "HITACHI 2m" },
  { detector = "P2_IN",  connector = 5, hybrid = 2, bottom_vmm = 4,  top_vmm = 5,  cable = "HITACHI 2m", top_order = "linear" },
  { detector = "P2_IN",  connector = 6, hybrid = 3, bottom_vmm = 6,  top_vmm = 7,  cable = "HITACHI 2m", top_order = "linear" },
  { detector = "P2_MID", connector = 4, hybrid = 4, bottom_vmm = 8,  top_vmm = 9,  cable = "HITACHI 2m" },
  { detector = "P2_MID", connector = 5, hybrid = 5, bottom_vmm = 10, top_vmm = 11, cable = "HITACHI 2m" },
  { detector = "P2_MID", connector = 6, hybrid = 6, bottom_vmm = 12, top_vmm = 13, cable = "HITACHI 2m" },
  { detector = "P2_OUT", connector = 4, hybrid = 7, bottom_vmm = 14, top_vmm = 15, cable = "HITACHI 2m" },
  { detector = "P2_OUT", connector = 5, hybrid = 8, bottom_vmm = 16, top_vmm = 17, cable = "HITACHI 2m" },
  { detector = "P2_OUT", connector = 6, hybrid = 9, bottom_vmm = 18, top_vmm = 19, cable = "HITACHI 2m" },
]

# Saturday 2026-08-01 morning access, between run 49 and run 50: P2_MID c4 and
# c6 HITACHI -> SAMTEC 2 m. The exact time is not logged; 11:14 is when the
# change was committed to run_config_beam.py (a668808). Runs 50-54 are the
# SAMTEC config scan. The spelling 'SAMPTEC' matches what the DAQ wrote into
# every run_config.json, so grouping by cable string keeps working.
[[cabling]]
valid_from = 2026-08-01T11:14:00
note = "P2_MID c4 + c6 HITACHI -> SAMPTEC 2m; P2_MID c5 is the in-station control"
hybrids = [
  { detector = "P2_IN",  connector = 4, hybrid = 1, bottom_vmm = 2,  top_vmm = 3,  cable = "HITACHI 2m" },
  { detector = "P2_IN",  connector = 5, hybrid = 2, bottom_vmm = 4,  top_vmm = 5,  cable = "HITACHI 2m", top_order = "linear" },
  { detector = "P2_IN",  connector = 6, hybrid = 3, bottom_vmm = 6,  top_vmm = 7,  cable = "HITACHI 2m", top_order = "linear" },
  { detector = "P2_MID", connector = 4, hybrid = 4, bottom_vmm = 8,  top_vmm = 9,  cable = "SAMPTEC 2m" },
  { detector = "P2_MID", connector = 5, hybrid = 5, bottom_vmm = 10, top_vmm = 11, cable = "HITACHI 2m" },
  { detector = "P2_MID", connector = 6, hybrid = 6, bottom_vmm = 12, top_vmm = 13, cable = "SAMPTEC 2m" },
  { detector = "P2_OUT", connector = 4, hybrid = 7, bottom_vmm = 14, top_vmm = 15, cable = "HITACHI 2m" },
  { detector = "P2_OUT", connector = 5, hybrid = 8, bottom_vmm = 16, top_vmm = 17, cable = "HITACHI 2m" },
  { detector = "P2_OUT", connector = 6, hybrid = 9, bottom_vmm = 18, top_vmm = 19, cable = "HITACHI 2m" },
]
