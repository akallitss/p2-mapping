[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-mapping"
dynamic = ["version"]
description = "P2 VMM readout: electronics channel to detector pad, per setup and date"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexandra Kallitsopoulou" }]
dependencies = ["numpy>=1.21", "pandas>=1.3", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
p2-mapping = "p2_mapping.cli:main"

[tool.setuptools.dynamic]
version = { attr = "p2_mapping.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p2_mapping = ["data/geometry/*.csv", "data/setups/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
